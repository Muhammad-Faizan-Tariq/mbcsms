# MBC SMS - Nginx Configuration
# Professional Structure with Shared Assets
# Place in: /etc/nginx/sites-available/mbc-sms.conf

server {
    listen 80;
    server_name 185.255.94.89;
    
    # Document root (public folder)
    root /var/www/html/mbc-sms/public;
    index index.php index.html;
    server_tokens off;

    # ==========================================
    # Security Headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # Gzip Compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # ==========================================
    # Shared Assets (CSS, JS, IMG, ICO)
    # ==========================================
    location ^~ /ints/assets/ {
        alias /var/www/html/mbc-sms/public/ints/assets/;
        expires 1w;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================
    # Login Page
    # ==========================================
    location = /ints/login {
        alias /var/www/html/mbc-sms/public/ints/login.html;
        default_type text/html;
    }

    # ==========================================
    # Auth Handler (signin.php)
    # ==========================================
    location = /ints/signin {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/mbc-sms/app/Auth/signin.php;
        include fastcgi_params;
    }

    # ==========================================
    # Logout
    # ==========================================
    location = /ints/logout {
        return 301 /ints/signin?action=logout;
    }

    # ==========================================
    # API Endpoints (without .php extension)
    # ==========================================
    location ~ ^/api/([a-zA-Z0-9_-]+)$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/$1.php;
        include fastcgi_params;
    }

    # API with .php extension (fallback)
    location ~ ^/api/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/$1.php;
        include fastcgi_params;
    }

    # ==========================================
    # Manager Panel
    # ==========================================
    # PHP handlers for manager res folder
    location ~ ^/ints/manager/res/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/ints/manager/res/$1.php;
        include fastcgi_params;
    }
    
    # Manager HTML pages (clean URLs)
    location /ints/manager/ {
        alias /var/www/html/mbc-sms/public/ints/manager/;
        try_files $uri $uri.html $uri/ =404;
    }

    # ==========================================
    # Agent Panel
    # ==========================================
    location ~ ^/ints/agent/res/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/ints/agent/res/$1.php;
        include fastcgi_params;
    }
    
    location /ints/agent/ {
        alias /var/www/html/mbc-sms/public/ints/agent/;
        try_files $uri $uri.html $uri/ =404;
    }

    # ==========================================
    # Client Panel
    # ==========================================
    location ~ ^/ints/client/res/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/ints/client/res/$1.php;
        include fastcgi_params;
    }
    
    location /ints/client/ {
        alias /var/www/html/mbc-sms/public/ints/client/;
        try_files $uri $uri.html $uri/ =404;
    }

    # ==========================================
    # General PHP Handler
    # ==========================================
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ==========================================
    # Security - Deny Access to Sensitive Files
    # ==========================================
    # Hide app, config, database folders (outside public)
    location ~ ^/(app|config|database|docs|scripts)/ {
        return 404;
    }

    # Hide old frontend folders (if still exist on server)
    location ~ ^/(Manager_frontend|Agent_frontend|client_frontend)/ {
        return 404;
    }

    # Deny sensitive file extensions
    location ~ /\.(env|sql|log|ini|sh|md|htaccess|git|gitignore)$ {
        deny all;
        return 404;
    }

    # Deny backup files
    location ~* \.(bak|backup|old|orig|tmp)$ {
        deny all;
        return 404;
    }

    # ==========================================
    # Static Files Caching
    # ==========================================
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1w;
        add_header Cache-Control "public";
        access_log off;
    }

    # ==========================================
    # Default
    # ==========================================
    location / {
        try_files $uri $uri/ /ints/login;
    }

    # Error pages
    error_page 404 /ints/login;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
