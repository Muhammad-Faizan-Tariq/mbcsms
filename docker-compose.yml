services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mbc_sms}
      MARIADB_USER: ${DB_USER:-mbc_user}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS in .env}
    volumes:
      - db_data:/var/lib/mysql
      # run once, on first start of an empty volume
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/smpp_tables.sql:/docker-entrypoint-initdb.d/02-smpp.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mbc_sms}
      DB_USER: ${DB_USER:-mbc_user}
      DB_PASS: ${DB_PASS}
      APP_URL: ${APP_URL:-http://localhost}
      APP_ENV: production
      APP_DEBUG: "false"
      SALT: ${SALT:-mbc_sms_secure_salt_2024}
      JASMIN_API_URL: ${JASMIN_API_URL:-http://localhost}
    volumes:
      - ./:/var/www/html/mbc-sms:ro

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html/mbc-sms:ro

volumes:
  db_data:
