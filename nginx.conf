server {
    listen 80;
    server_name 185.255.94.89;
    root /var/www/html/mbc-sms;
    index index.php index.html;
    server_tokens off;

    # ==========================================
    # PHP Handler for /ints/signin
    # ==========================================
    location = /ints/signin {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/ints/signin.php;
        include fastcgi_params;
    }

    # ==========================================
    # Logout
    # ==========================================
    location = /ints/logout {
        return 301 /ints/signin?action=logout;
    }

    # ==========================================
    # Login Page
    # ==========================================
    location = /ints/login {
        alias /var/www/html/mbc-sms/client_frontend/ints/login.html;
        default_type text/html;
    }

    # ==========================================
    # Shared Assets
    # ==========================================
    location ^~ /ints/ico/ {
        alias /var/www/html/mbc-sms/client_frontend/ints/ico/;
    }
    location ^~ /ints/img/ {
        alias /var/www/html/mbc-sms/client_frontend/ints/img/;
    }
    location ^~ /ints/css/ {
        alias /var/www/html/mbc-sms/Manager_frontend/ints/css/;
    }
    location ^~ /ints/js/ {
        alias /var/www/html/mbc-sms/Manager_frontend/ints/js/;
    }

    # ==========================================
    # API without .php extension
    # ==========================================
    location ~ ^/api/([a-zA-Z0-9_-]+)$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/$1.php;
        include fastcgi_params;
    }

    # API with .php extension
    location ~ ^/api/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ==========================================
    # Manager Panel - handle res/*.php for DataTables
    # ==========================================
    location ~ ^/ints/manager/res/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/Manager_frontend/ints/manager/res/$1.php;
        include fastcgi_params;
    }
    
    location /ints/manager/ {
        alias /var/www/html/mbc-sms/Manager_frontend/ints/manager/;
        try_files $uri $uri.html $uri/ =404;
    }

    # ==========================================
    # Agent Panel
    # ==========================================
    location ~ ^/ints/agent/res/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/Agent_frontend/ints/agent/res/$1.php;
        include fastcgi_params;
    }
    
    location /ints/agent/ {
        alias /var/www/html/mbc-sms/Agent_frontend/ints/agent/;
        try_files $uri $uri.html $uri/ =404;
    }

    # ==========================================
    # Client Panel
    # ==========================================
    location ~ ^/ints/client/res/(.+)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/client_frontend/ints/client/res/$1.php;
        include fastcgi_params;
    }
    
    location /ints/client/ {
        alias /var/www/html/mbc-sms/client_frontend/ints/client/;
        try_files $uri $uri.html $uri/ =404;
    }

    # ==========================================
    # General PHP
    # ==========================================
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ==========================================
    # Security - Hide frontend folders
    # ==========================================
    location ~ ^/(Manager_frontend|Agent_frontend|client_frontend)/ {
        return 404;
    }

    # Deny sensitive files
    location ~ /\.(env|sql|log|ini|sh|md|htaccess)$ {
        deny all;
    }

    # ==========================================
    # Static Files
    # ==========================================
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1w;
    }
}
